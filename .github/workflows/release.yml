name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_release_type:
    name: Evaluate Release Tag
    runs-on: ubuntu-24.04
    outputs:
      is_stable: ${{ steps.check.outputs.is_stable }}
    steps:
      - name: Check Release Tag
        id: check
        run: |
          if [[ "${{ github.ref_name }}" =~ -(rc|alpha|beta) ]]; then
            echo "is_stable=false" >> $GITHUB_OUTPUT
          else
            echo "is_stable=true" >> $GITHUB_OUTPUT
          fi

  python_sdist:
    name: Build sdist + Publish PyPI
    runs-on: ubuntu-24.04
    needs: [ check_release_type ]
    permissions:
      id-token: write
      contents: read
    environment:
      name: release
      url: https://pypi.org/p/tachyon-ipc
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'python'
          compiler: 'clang'

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-dev
          sudo mkdir -p /usr/local/include/dlpack
          sudo curl -fsSL -o /usr/local/include/dlpack/dlpack.h \
            https://raw.githubusercontent.com/dmlc/dlpack/main/include/dlpack/dlpack.h

      - name: Build sdist
        working-directory: bindings/python
        run: |
          pip install build
          python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

      - name: Publish to PyPI
        if: needs.check_release_type.outputs.is_stable == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: bindings/python/dist/

  rust_publish:
    name: Publish crates.io
    runs-on: ubuntu-24.04
    needs: [ check_release_type ]
    if: needs.check_release_type.outputs.is_stable == 'true'
    permissions:
      contents: read
      id-token: write
    environment:
      name: release
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'rust'
          compiler: 'clang'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 'stable'

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish tachyon-sys
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        working-directory: bindings/rust
        run: cargo publish -p tachyon-sys --allow-dirty

      - name: Wait for crates.io index propagation
        run: sleep 60

      - name: Publish tachyon-ipc
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        working-directory: bindings/rust
        run: cargo publish -p tachyon-ipc --allow-dirty

  go_publish:
    name: Tag Go Module
    runs-on: ubuntu-24.04
    needs: [ check_release_type ]
    if: needs.check_release_type.outputs.is_stable == 'true'
    permissions:
      contents: write
    environment:
      name: release
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Derive Go module tag
        id: gotag
        run: |
          VERSION="${{ github.ref_name }}"
          GO_TAG="bindings/go/${VERSION}"
          echo "tag=${GO_TAG}"     >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Sanity-check go.mod
        run: |
          MODULE=$(grep '^module ' bindings/go/go.mod | awk '{print $2}')
          TOOLCHAIN=$(grep '^go ' bindings/go/go.mod | awk '{print $2}')
          echo "module:    ${MODULE}"
          echo "toolchain: go ${TOOLCHAIN}"
          [ "${MODULE}" = "github.com/riyaneel/tachyon/bindings/go" ] || \
            { echo "unexpected module path: ${MODULE}"; exit 1; }

      - name: Push Go module tag
        run: |
          GO_TAG="${{ steps.gotag.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${GO_TAG}" >/dev/null 2>&1; then
            echo "Tag ${GO_TAG} already exists - skipping."
          else
            git tag "${GO_TAG}"
            git push origin "${GO_TAG}"
            echo "Pushed ${GO_TAG}"
          fi

      - name: Trigger pkg.go.dev indexing
        env:
          MODULE: github.com/riyaneel/tachyon/bindings/go
          VERSION: ${{ steps.gotag.outputs.version }}
        run: |
          echo "Triggering proxy fetch for ${MODULE}@${VERSION}"
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://proxy.golang.org/${MODULE}/@v/${VERSION}.info" || true
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://sum.golang.org/lookup/${MODULE}@${VERSION}"    || true

  java_native_linux:
    name: Build Native FFM (Linux ${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            preset: clang-release
          - arch: aarch64
            preset: clang-aarch64-release

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'java'
          compiler: 'clang'

      - name: Install aarch64 cross toolchain
        if: matrix.arch == 'aarch64'
        run: sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libstdc++-14-dev-arm64-cross

      - name: Build Linux FFM (${{ matrix.arch }})
        run: |
          cmake --preset ${{ matrix.preset }} -DTACHYON_ENABLE_BENCH=OFF
          cmake --build --preset ${{ matrix.preset }} --target tachyon_java_resources

      - name: Upload Linux Native asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-${{ matrix.arch }}
          path: bindings/java/src/main/resources/native
          if-no-files-found: 'error'

  java_native_macos:
    name: Build Native FFM (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'java'

      - name: Build Native library
        run: |
          cmake --preset macos-release -DTACHYON_ENABLE_BENCH=OFF
          cmake --build --preset macos-release --parallel
          cmake --build --preset macos-release --target tachyon_java_resources

      - name: Upload macOS Native asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-macos-${{ matrix.arch }}
          path: bindings/java/src/main/resources/native
          if-no-files-found: 'error'

  jvm_publish:
    name: Publish Fat JAR to Maven Central (${{ matrix.lang }})
    runs-on: ubuntu-24.04
    needs: [ check_release_type, java_native_linux, java_native_macos ]
    if: needs.check_release_type.outputs.is_stable == 'true'
    environment:
      name: release
    strategy:
      fail-fast: false
      matrix:
        lang: [ java, kotlin ]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Download Native Assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: bindings/java/src/main/resources/native
          merge-multiple: true

      - name: Publish to Central Portal
        working-directory: bindings/${{ matrix.lang }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-daemon --no-build-cache --rerun-tasks

      - name: Assemble Fat JAR for GitHub Release
        working-directory: bindings/${{ matrix.lang }}
        run: ./gradlew jar --no-daemon

      - name: Upload Fat JAR artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: '${{ matrix.lang }}-fat-jar'
          path: bindings/${{ matrix.lang }}/build/libs/tachyon-${{ matrix.lang }}-*.jar
          if-no-files-found: 'error'

  nodejs_prebuilt:
    name: Node.js Prebuilt (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            platform: linux
          - os: macos-26-intel
            arch: x64
            platform: darwin
          - os: macos-26
            arch: arm64
            platform: darwin
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'node'
          compiler: 'clang'

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: bindings/js
        run: npm ci --ignore-scripts

      - name: Build Prebuilt
        working-directory: bindings/js
        run: |
          npx cmake-js compile --arch ${{ matrix.arch }}
          TARGET_DIR="prebuilds/${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "${TARGET_DIR}"
          cp build/Release/*.node "${TARGET_DIR}/node.napi.node"
          if [ "${{ matrix.platform }}" = "linux" ]; then
            strip "${TARGET_DIR}/node.napi.node"
          else
            strip -x "${TARGET_DIR}/node.napi.node"
          fi

      - name: Create Tarball Asset
        run: |
          mkdir -p dist
          tar -czf "dist/tachyon-js-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C bindings/js/prebuilds .

      - name: Upload Prebuilt Artifact (NPM publish)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: bindings/js/prebuilds/
          if-no-files-found: 'error'

      - name: Upload Tarball Asset (GH Release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-tarball-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: 'error'

  nodejs_publish:
    name: Publish Node.js to NPM
    runs-on: ubuntu-24.04
    needs: [ check_release_type, nodejs_prebuilt ]
    if: needs.check_release_type.outputs.is_stable == 'true'
    permissions:
      contents: read
      id-token: write
    environment:
      name: release
      url: https://www.npmjs.com/package/@tachyon-ipc/core
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'node'
          sdk: 'emscripten'

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download all prebuilts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bindings/js/prebuilds
          pattern: js-prebuild-*
          merge-multiple: 'true'

      - name: Build WASM core and TypeScript
        working-directory: bindings/js
        run: |
          npm ci --ignore-scripts
          npm run build:wasm
          npm run build:ts
          npm run stage:wasm

      - name: Publish to NPM
        working-directory: bindings/js
        run: npm publish --access public

  csharp_native_linux:
    name: Build Native C# (${{ matrix.rid }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            arch: amd64
          - rid: linux-arm64
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'c#'
          compiler: 'clang'

      - name: Install aarch64 cross toolchain
        if: matrix.arch == 'arm64'
        run: sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libstdc++-14-dev-arm64-cross

      - name: Build libtachyon (x86-64)
        if: matrix.arch == 'amd64'
        run: |
          cmake --preset clang-release -DTACHYON_ENABLE_BENCH=OFF
          cmake --build --preset clang-release --target tachyon --parallel
          mkdir -p bindings/csharp/src/TachyonIpc/runtimes/linux-x64/native
          cp build/clang-release/core/libtachyon.so \
            bindings/csharp/src/TachyonIpc/runtimes/linux-x64/native/libtachyon.so

      - name: Build libtachyon (aarch64)
        if: matrix.arch == 'arm64'
        run: |
          cmake --preset clang-aarch64-release -DTACHYON_ENABLE_BENCH=OFF
          cmake --build --preset clang-aarch64-release --target tachyon --parallel
          mkdir -p bindings/csharp/src/TachyonIpc/runtimes/linux-arm64/native
          cp build/clang-aarch64-release/core/libtachyon.so \
            bindings/csharp/src/TachyonIpc/runtimes/linux-arm64/native/libtachyon.so

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csharp-native-${{ matrix.rid }}
          path: bindings/csharp/src/TachyonIpc/runtimes/${{ matrix.rid }}/native/libtachyon.so
          if-no-files-found: error

  csharp_native_macos:
    name: Build Native C# (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            rid: osx-arm64
          - runner: macos-26-intel
            rid: osx-x64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'c#'

      - name: Build libtachyon.dylib
        run: |
          cmake --preset macos-release -DTACHYON_ENABLE_BENCH=OFF
          cmake --build --preset macos-release --parallel
          mkdir -p bindings/csharp/src/TachyonIpc/runtimes/${{ matrix.rid }}/native
          cp build/macos-release/core/libtachyon.dylib \
            bindings/csharp/src/TachyonIpc/runtimes/${{ matrix.rid }}/native/libtachyon.dylib

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csharp-native-${{ matrix.rid }}
          path: bindings/csharp/src/TachyonIpc/runtimes/${{ matrix.rid }}/native/libtachyon.dylib
          if-no-files-found: error

  csharp_publish:
    name: NuGet Publish
    runs-on: ubuntu-24.04
    needs: [ check_release_type, csharp_native_linux, csharp_native_macos ]
    if: needs.check_release_type.outputs.is_stable == 'true'
    permissions:
      id-token: write
      contents: read
    environment:
      name: release
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Download linux-x64 native
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: csharp-native-linux-x64
          path: bindings/csharp/src/TachyonIpc/runtimes/linux-x64/native

      - name: Download linux-arm64 native
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: csharp-native-linux-arm64
          path: bindings/csharp/src/TachyonIpc/runtimes/linux-arm64/native

      - name: Download osx-arm64 native
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: csharp-native-osx-arm64
          path: bindings/csharp/src/TachyonIpc/runtimes/osx-arm64/native

      - name: Download osx-x64 native
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: csharp-native-osx-x64
          path: bindings/csharp/src/TachyonIpc/runtimes/osx-x64/native

      - name: Pack NuGet
        working-directory: bindings/csharp/src/TachyonIpc
        run: dotnet pack -c Release -o dist/

      - name: NuGet Login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      - name: NuGet push
        working-directory: bindings/csharp/src/TachyonIpc
        run: |
          dotnet nuget push dist/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csharp-nupkg
          path: bindings/csharp/src/TachyonIpc/dist/*.nupkg
          if-no-files-found: error

  tachyon_top:
    name: Build tachyon-top CLI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'cpp'

      - name: Configure and Build
        run: |
          cmake --preset tachyon-top-ci
          cmake --build --preset tachyon-top-ci --parallel
          strip --strip-all build/tachyon-top-ci/tools/tachyon-top/tachyon_top
          mv build/tachyon-top-ci/tools/tachyon-top/tachyon_top tachyon-top-linux-x86_64

      - name: Upload tachyon-top artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tachyon-top-linux-x86_64
          path: tachyon-top-linux-x86_64
          if-no-files-found: 'error'

  github_release:
    name: Create GitHub Release
    needs: [ python_sdist, rust_publish, go_publish, jvm_publish, nodejs_publish, csharp_publish, tachyon_top ]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    environment:
      name: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Download Python sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdist
          path: dist/

      - name: Download Java Fat JAR
        if: needs.jvm_publish.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          pattern: '*-fat-jar'
          merge-multiple: 'true'

      - name: Download Node Tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          pattern: node-tarball-*
          merge-multiple: 'true'

      - name: Download NuGet package
        if: needs.csharp_publish.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: csharp-nupkg
          path: dist/

      - name: Download tachyon-top binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tachyon-top-linux-x86_64
          path: dist/

      - name: Create C++ source tarball
        run: |
          TAG="${{ github.ref_name }}"
          git archive \
            --format=tar.gz \
            --prefix="tachyon-${TAG}/" \
            --output="dist/tachyon-${TAG}-source.tar.gz" \
            "${TAG}"

      - name: Generate SHA256 checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign artifacts
        run: |
          for f in dist/*; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes "$f" \
              --bundle "${f}.bundle"
          done

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          python3 - <<'EOF' > /tmp/release_notes.md
          import re, sys

          tag = "${{ github.ref_name }}"
          try:
              text = open("CHANGELOG").read()
              pattern = rf"(## \[{re.escape(tag)}\].*?)(?=\n## |\Z)"
              m = re.search(pattern, text, re.DOTALL)
              if m:
                  print(m.group(1).strip())
              else:
                  print(f"Release {tag}")
          except FileNotFoundError:
              print(f"Release {tag}")
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          PRERELEASE_FLAG=""
          if echo "${TAG}" | grep -qE '\-(rc|alpha|beta)'; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${TAG}" \
            --title "Tachyon ${TAG}" \
            --notes-file /tmp/release_notes.md \
            ${PRERELEASE_FLAG} \
            dist/*
