name: ClusterFuzzLite Batch

on:
  push:
    branches:
      - development
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'Fuzzing time in seconds'
        required: true
        type: number
        default: 600

permissions:
  contents: read

jobs:
  batch:
    name: Batch Fuzzing (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    concurrency:
      group: cfl-batch-${{ github.ref_name }}-${{ matrix.sanitizer }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ address, memory, undefined ]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build Fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          sanitizer: ${{ matrix.sanitizer }}

      - name: Run Fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ inputs.fuzz_seconds || '600' }}
          mode: 'batch'
          sanitizer: ${{ matrix.sanitizer }}
