name: "CodeQL Advanced"

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]
  schedule:
    - cron: '42 15 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual
            tachyon-lang: cpp
          - language: csharp
            build-mode: manual
            tachyon-lang: c#
          - language: go
            build-mode: autobuild
          - language: java-kotlin
            build-mode: manual
            tachyon-lang: java
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Environment
        if: matrix.tachyon-lang
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: ${{ matrix.tachyon-lang }}

      - name: Setup Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          cache-dependency-path: |
            bindings/java/*.gradle*
            bindings/java/**/gradle-wrapper.properties
            bindings/kotlin/*.gradle*
            bindings/kotlin/**/gradle-wrapper.properties

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build (c-cpp)
        if: matrix.language == 'c-cpp'
        run: |
          cmake --preset clang-release -DTACHYON_ENABLE_BENCH=OFF
          cmake --build --preset clang-release --parallel

      - name: Build (csharp)
        if: matrix.language == 'csharp'
        run: |
          cmake --preset clang-release -DTACHYON_ENABLE_BENCH=OFF
          cmake --build --preset clang-release --parallel
          mkdir -p bindings/csharp/src/TachyonIpc/runtimes/linux-x64/native
          cp build/clang-release/core/libtachyon.so bindings/csharp/src/TachyonIpc/runtimes/linux-x64/native/
          dotnet build bindings/csharp/src/TachyonIpc/

      - name: Build (java-kotlin)
        if: matrix.language == 'java-kotlin'
        run: |
          cmake --preset clang-release -DTACHYON_ENABLE_BENCH=OFF
          cmake --build --preset clang-release --target tachyon_java_resources --parallel
          cd bindings/java && ./gradlew compileJava --no-daemon
          cd ../kotlin && ./gradlew compileKotlin --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{matrix.language}}"
