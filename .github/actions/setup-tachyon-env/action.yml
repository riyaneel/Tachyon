name: Setup Tachyon Environment
description: 'Bootstrapper: configures OS, toolchains, caches, and vendors the C++ core'
inputs:
  lang:
    description: 'Target language for vendoring (cpp, python, rust, go, java, c#, node)'
    required: true
  compiler:
    description: 'Compiler to use (clang or gcc)'
    required: false
    default: 'clang'
  llvm-version:
    description: 'LLVM Version'
    required: false
    default: '21'
  gcc-version:
    description: 'GCC Version'
    required: false
    default: '16'
  build-type:
    description: 'Build type for cache keys (debug/release)'
    required: false
    default: 'release'
  sanitizer:
    description: 'Sanitizer profile to prevent cache trashing'
    required: false
    default: 'none'
  sdk:
    description: 'SDK to install (none, emscripten)'
    required: false
    default: 'none'
  sdk-version:
    description: 'Version of the SDK selected by `sdk`'
    required: false
    default: '4.0.10'

runs:
  using: composite
  steps:
    - name: Install ccache (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ccache

    - name: Install ccache (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install ccache

    - name: Fingerprint host CPU
      id: cpu
      shell: bash
      run: |
        if [ -r /proc/cpuinfo ]; then
          id=$(grep -m1 -E '^(flags|Features)' /proc/cpuinfo)
        else
          id=$(sysctl -n machdep.cpu.brand_string)
        fi
        echo "key=$(echo "$id" | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Configure ccache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        key: ccache-${{ runner.os }}-cpu_${{ steps.cpu.outputs.key }}-${{ github.job }}-${{ inputs.compiler }}-${{ inputs.build-type }}-sanitizer_${{ inputs.sanitizer }}-${{ github.sha }}
        path: |
          ~/.cache/ccache
          ~/Library/Caches/ccache
        restore-keys: |
          ccache-${{ runner.os }}-cpu_${{ steps.cpu.outputs.key }}-${{ github.job }}-${{ inputs.compiler }}-${{ inputs.build-type }}-sanitizer_${{ inputs.sanitizer }}-
          ccache-${{ runner.os }}-cpu_${{ steps.cpu.outputs.key }}-${{ github.job }}-

    - name: Setup Kitware APT repository (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | \
          gpg --dearmor - | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null
        echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ noble main' | \
          sudo tee /etc/apt/sources.list.d/kitware.list >/dev/null

    - name: Install CMake and Ninja (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends kitware-archive-keyring cmake ninja-build

    - name: Install GCC (Linux)
      if: runner.os == 'Linux' && inputs.compiler == 'gcc'
      shell: bash
      run: |
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
        sudo apt-get update -qq
        sudo apt install gcc-${{ inputs.gcc-version }} g++-${{ inputs.gcc-version }}

    - name: Install LLVM (Linux)
      if: runner.os == 'Linux' && inputs.compiler == 'clang' && inputs.sdk == 'none'
      shell: bash
      run: bash ci/install_llvm.sh ${{ inputs.llvm-version }}

    - name: Cache Emscripten SDK
      if: inputs.sdk == 'emscripten'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        key: emsdk-${{ runner.os }}-${{ inputs.sdk-version }}
        path: ${{ github.workspace }}/.emsdk

    - name: Install Emscripten SDK
      if: inputs.sdk == 'emscripten'
      shell: bash
      run: bash ci/setup/install_emsdk.sh ${{ inputs.sdk-version }}

    - name: Export Emscripten environment
      if: inputs.sdk == 'emscripten'
      shell: bash
      run: |
        EMSDK_DIR="${GITHUB_WORKSPACE}/.emsdk"
        source "${EMSDK_DIR}/emsdk_env.sh" >/dev/null
        env | grep '^EMSDK' >> $GITHUB_ENV
        echo "$PATH" | tr ':' '\n' | grep "${EMSDK_DIR}" >> $GITHUB_PATH

    - name: Vendor C++ core
      if: inputs.lang != 'cpp' && inputs.lang != 'python'
      shell: bash
      run: bash ci/vendor.sh ${{ inputs.lang }}

    - name: Export ccache launchers
      shell: bash
      run: |
        echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
        echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV

    - name: Export host compiler
      if: inputs.sdk == 'none'
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          if [ "${{ inputs.compiler }}" = "gcc" ]; then
            echo "CC=gcc-${{ inputs.gcc-version }}" >> $GITHUB_ENV
            echo "CXX=g++-${{ inputs.gcc-version }}" >> $GITHUB_ENV
          elif [ "${{ inputs.compiler }}" = "clang" ]; then
            echo "CC=clang-${{ inputs.llvm-version }}" >> $GITHUB_ENV
            echo "CXX=clang++-${{ inputs.llvm-version }}" >> $GITHUB_ENV
          fi
        else
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        fi
